<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ron 的加州律考通 · Ron's CalBar Trainer</title>
<meta name="description" content="Ron's California Bar Exam bilingual spaced-repetition trainer · Ron 的加州律师执照考试中英双语记忆训练器">
<meta name="theme-color" content="#1c2440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="律考通">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="%23e8710a"/><text x="50" y="66" font-size="52" text-anchor="middle">⚖️</text></svg>'>
<style>
/*__STYLE__*/
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="brand"><span class="seal">⚖️</span>Ron 的加州律考通<small>Ron's CalBar Trainer</small></span>
    <span class="spacer"></span>
    <span class="pill streak" id="pill-streak">🔥 0</span>
    <span class="pill" id="pill-rank" onclick="location.hash='#stats'" style="cursor:pointer">🪶</span>
  </div>
  <div id="view"></div>
</div>
<div class="nav">
  <button data-tab="home" onclick="location.hash='#home'"><span class="ico">🏛️</span>__NAV_HOME__</button>
  <button data-tab="browse" onclick="location.hash='#browse'"><span class="ico">📚</span>__NAV_BROWSE__</button>
  <button data-tab="stats" onclick="location.hash='#stats'"><span class="ico">📈</span>__NAV_STATS__</button>
  <button data-tab="set" onclick="location.hash='#settings'"><span class="ico">⚙️</span>__NAV_SET__</button>
</div>
<canvas id="confetti"></canvas>
<div id="toast"></div>
<script>
/*__DATA__*/
</script>
<script>
/*__CORE__*/
</script>
<script>
/*__FEATURES__*/
</script>
<script>
/*__UI__*/
</script>
<script>
/* nav labels follow language */
(function () {
  function navLabels() {
    const labs = { home: t("nav.home"), browse: t("nav.browse"), stats: t("nav.stats"), set: t("nav.set") };
    document.querySelectorAll(".nav button").forEach(b => {
      b.childNodes[1] && b.removeChild(b.childNodes[1]);
      b.appendChild(document.createTextNode(labs[b.dataset.tab]));
    });
  }
  navLabels();
  window.addEventListener("hashchange", navLabels);
  window.addEventListener("i18nchange", navLabels);
  const _setLang = window.setLang;
  window.setLang = v => { _setLang(v); navLabels(); };
})();
</script>
</body>
</html>
